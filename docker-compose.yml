services:
  # PostgreSQL Database Container
  db:
    image: postgres:16-alpine
    container_name: ludo_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ludo_user
      POSTGRES_PASSWORD: ludo_password
      POSTGRES_DB: ludo_db
    ports:
      # Host 5434 -> container 5432. Kept off 5432/5433 which are already used
      # by other local Postgres projects.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludo_user -d ludo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-time database migration (applies the Prisma schema to Postgres)
  db-setup:
    image: node:20-alpine
    container_name: ludo_db_setup
    working_dir: /app
    volumes:
      - ./prisma:/app/prisma
    environment:
      - DATABASE_URL=postgresql://ludo_user:ludo_password@db:5432/ludo_db?schema=public
    command: sh -c "npx --yes prisma@5.19.0 db push --skip-generate"
    depends_on:
      db:
        condition: service_healthy

  # Next.js Web Application Container
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ludo_web_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://ludo_user:ludo_password@db:5432/ludo_db?schema=public
      - PORT=3000
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - ADMIN_USERNAMES=${ADMIN_USERNAMES:-admin}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-vixalyze.contact@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-fvgo hxna skzg ugcr}
      - SMTP_FROM=${SMTP_FROM:-Ludo Master <vixalyze.contact@gmail.com>}
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

volumes:
  postgres_data:
    driver: local
